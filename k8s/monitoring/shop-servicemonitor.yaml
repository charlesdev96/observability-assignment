apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop-services
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - shop
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shop
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
