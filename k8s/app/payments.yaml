apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: shop
  labels:
    app: payments
    app.kubernetes.io/part-of: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
        app.kubernetes.io/part-of: shop
    spec:
      containers:
        - name: payments
          image: shop-app:1.0.0
          imagePullPolicy: IfNotPresent
          args: ["src/payments.js"]
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: FAILURE_RATE
              value: "0"
            - name: LATENCY_MS
              value: "0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: shop
  labels:
    app: payments
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app: payments
  ports:
    - name: http
      port: 3003
      targetPort: http
